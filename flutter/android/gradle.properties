org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Use the SDK's own AAPT2 rather than the one AGP downloads from Maven.
#
# NixOS has no /lib64/ld-linux-x86-64.so.2, so the Maven binary — a
# prebuilt dynamically-linked ELF — cannot start at all: gradle reports
# "AAPT2 Daemon startup failed" with no further explanation. The copy in
# the nix SDK is patchelf'd against the store's glibc and works.
android.aapt2FromMavenOverride=/nix/store/f9nwr0gzxqhyzzk5dqc0496k7qvhp1ia-androidsdk/libexec/android-sdk/build-tools/36.0.0/aapt2
