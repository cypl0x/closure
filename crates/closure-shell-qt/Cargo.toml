[package]
name = "closure-shell-qt"
description = "Native Qt6/QML desktop shell over the closure vault (Layer 5, X1c)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# The native Qt6/QML window. Opt-in (pulls qmetaobject + a Qt6 SDK via
# qmake at build time); the default build stays hermetic and `just check`
# never touches Qt (I10).
qt = ["dep:qmetaobject"]

[dependencies]
closure-store = { path = "../closure-store" }
closure-shell-core = { path = "../closure-shell-core" }
qmetaobject = { version = "0.2", optional = true }

[dev-dependencies]
# `Action::new` takes an InputMode, so the tests that build a
# palette node need it. Not a runtime dependency: the renderer is
# handed nodes, it does not choose a keymap.
closure-config = { path = "../closure-config" }
tempfile = "3"
