[package]
name = "closure-shell-egui"
description = "Native desktop shell built on egui/eframe (Layer 5). Consumes closure-core only (I7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
egui = ["dep:eframe", "dep:egui"]

[dependencies]
closure-core = { path = "../closure-core" }
closure-store = { path = "../closure-store" }
closure-query = { path = "../closure-query" }
closure-shell-core = { path = "../closure-shell-core" }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.31", optional = true }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
