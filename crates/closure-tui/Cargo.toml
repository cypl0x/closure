[package]
name = "closure-tui"
description = "ratatui + crossterm terminal shell for the closure kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
closure-config = { path = "../closure-config" }
closure-record = { path = "../closure-record" }
closure-core = { path = "../closure-core" }
closure-input = { path = "../closure-input" }
closure-org = { path = "../closure-org" }
closure-query = { path = "../closure-query" }
closure-store = { path = "../closure-store" }
closure-undo = { path = "../closure-undo" }
closure-tree-sitter = { path = "../closure-tree-sitter" }
closure-shell-core = { path = "../closure-shell-core" }
crossterm.workspace = true
ratatui.workspace = true
thiserror.workspace = true

[features]
# V6b: real tree-sitter highlighting in the file view. Default OFF — the
# dep-free KeywordHighlighter stays the hermetic default; forwards the
# grammar feature to closure-tree-sitter. Gate: `just tree-sitter`.
tree-sitter = ["closure-tree-sitter/tree-sitter"]

[dev-dependencies]
insta.workspace = true
tempfile = "3"
