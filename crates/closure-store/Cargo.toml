[package]
name = "closure-store"
description = "Vault loader, file watcher, atomic writes, and cross-file indices for closure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Forward the wasm sandbox exec tier (C1c) to closure-eval. Opt-in;
# default build stays hermetic. Gate: `just eval-wasm`.
wasmtime = ["closure-eval/wasmtime"]

[dependencies]
closure-core = { path = "../closure-core" }
closure-config = { path = "../closure-config" }
closure-cron = { path = "../closure-cron" }
closure-eval = { path = "../closure-eval" }
closure-org = { path = "../closure-org" }
notify.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
# Test-only: exercise the real fuzzy path in the scale budget (C4a).
# A dev-dependency back-edge — cargo permits dev-dep cycles.
closure-query = { path = "../closure-query" }
