[package]
name = "closure-plugin-host"
description = "Wasm plugin ABI with a semver-pinned core API (Layer 4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Embedded wasm runtime (opt-in; pulls wasmtime + cranelift). The
# default workspace stays hermetic without it; the build gate lives in
# the justfile (`just plugin-wasm`).
wasmtime = ["dep:wasmtime"]

[dependencies]
blake3 = "1"
closure-core = { path = "../closure-core" }
thiserror.workspace = true
wasmtime = { version = "45", optional = true, default-features = false, features = [
  "cranelift",
  "runtime",
  "wat",
] }

[dev-dependencies]
tempfile = "3"
