[package]
name = "closure-sync"
description = "File / git / P2P sync for closure vaults (Layer 3). Pluggable transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
closure-core = { path = "../closure-core" }
closure-store = { path = "../closure-store" }
closure-crdt = { path = "../closure-crdt" }
thiserror.workspace = true
# Pure-Rust ed25519 (no C, no build-time network) for signing sync
# frames (C3a). Hermetic — keeps I10. `rand_core` for keygen.
ed25519-dalek = "2"
# Pure-Rust Noise protocol (default-resolver: chacha20poly1305 + x25519
# + blake2, no C, no async runtime) for encrypting the transport (C3b).
snow = "0.9"
# Pure-Rust cryptographic content hash (D2). 256-bit BLAKE3 backs the
# `Cid`: collision-resistant, deterministic (I6), hermetic (no C, builds
# offline). Replaces the former non-cryptographic FNV-1a digest.
blake3 = "1"

[dev-dependencies]
tempfile = "3"
