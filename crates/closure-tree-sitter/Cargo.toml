[package]
name = "closure-tree-sitter"
description = "Optional tree-sitter integration for syntax highlighting inside #+BEGIN_SRC code blocks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tree-sitter = { version = "0.26.9", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-nix = { version = "0.3.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }

[features]
# Real tree-sitter highlighting (V6 + D5). Default OFF — pulls C grammars
# (non-hermetic); the dep-free KeywordHighlighter stays the default. One
# feature bundles every grammar, so the `TsHighlighter` registry is
# whole when it is on: a build where `rust` highlights and `nix` does
# not is a worse answer than either "all of them" or "none". Build/test
# gate: `just tree-sitter`.
#
# Twenty languages, chosen for what actually turns up in a `#+BEGIN_SRC`
# block in a vault rather than for coverage of crates.io. Each one is a
# C grammar compiled from source, which is why this is opt-in and why
# CI does not build it.
tree-sitter = [
  "dep:tree-sitter",
  "dep:tree-sitter-bash",
  "dep:tree-sitter-c",
  "dep:tree-sitter-cpp",
  "dep:tree-sitter-css",
  "dep:tree-sitter-go",
  "dep:tree-sitter-haskell",
  "dep:tree-sitter-html",
  "dep:tree-sitter-java",
  "dep:tree-sitter-javascript",
  "dep:tree-sitter-json",
  "dep:tree-sitter-lua",
  "dep:tree-sitter-md",
  "dep:tree-sitter-nix",
  "dep:tree-sitter-python",
  "dep:tree-sitter-ruby",
  "dep:tree-sitter-rust",
  "dep:tree-sitter-toml-ng",
  "dep:tree-sitter-typescript",
  "dep:tree-sitter-yaml",
]
