[package]
name = "closure-tree-sitter"
description = "Optional tree-sitter integration for syntax highlighting inside #+BEGIN_SRC code blocks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tree-sitter = { version = "0.26.9", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }

[features]
# Real tree-sitter highlighting (V6). Default OFF — pulls a C grammar
# (non-hermetic); the dep-free KeywordHighlighter stays the default.
# Build/test gate: `just tree-sitter`.
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-bash"]
