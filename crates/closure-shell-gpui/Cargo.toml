[package]
name = "closure-shell-gpui"
description = "gpui (Zed) native desktop shell for closure. High-perf alternative to egui; matrix entry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Stable crates.io gpui (Zed's high-perf GPU UI) for hermetic builds (I10).
# Pure core for custom polished tree/search/editor; avoids external git deps that break nix flake.
gpui = "0.2"

# For kernel-agnostic shell model (I7): reuse Vault + query + core commands (parity with egui).
closure-core = { path = "../closure-core" }
closure-store = { path = "../closure-store" }
closure-query = { path = "../closure-query" }

[dev-dependencies]
tempfile = "3"
