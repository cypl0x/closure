[package]
name = "closure-shell-gpui"
description = "gpui (Zed) native desktop shell for closure. High-perf alternative to egui; matrix entry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Real tree-sitter grammars inside `#+BEGIN_SRC` blocks. Off by
# default for the same reason `closure-tree-sitter` has it off: twenty
# C grammars are not a hermetic build. Forwarded so that the shell you
# look at all day can actually get them — it could not before.
tree-sitter = ["closure-tree-sitter/tree-sitter"]
# Off by default: gpui pulls ~570 transitive crates and needs system
# GPU/X11/xkbcommon/freetype libs, which breaks the hermetic build and
# the `cargo test --workspace` gate (I10). The kernel-side Shell model
# is dep-free and always compiled; the real window only builds under
# `--features gpui`.
default = []
gpui = ["dep:gpui"]
# The window itself, driven headlessly. gpui's `test-support` ships a
# `TestAppContext` over a stub platform, which is what lets `render`,
# `on_key` and the mouse handlers be tested without a GPU — the one
# part of this crate that used to be compile-checked and never run.
gpui-test = ["gpui", "gpui/test-support", "dep:tempfile"]

[dependencies]
# Stable crates.io gpui (Zed's high-perf GPU UI), opt-in via the `gpui`
# feature so the default workspace build stays hermetic (I10).
gpui = { version = "0.2", optional = true }
# Only for the `gpui-test` window harness (src/testing.rs).
tempfile = { version = "3", optional = true }

# For kernel-agnostic shell model (I7): reuse Vault + query + core commands (parity with egui).
closure-core = { path = "../closure-core" }
closure-store = { path = "../closure-store" }
closure-query = { path = "../closure-query" }
closure-org = { path = "../closure-org" }
closure-shell-core = { path = "../closure-shell-core" }
closure-tree-sitter = { path = "../closure-tree-sitter" }
closure-config = { path = "../closure-config" }
closure-input = { path = "../closure-input" }
closure-sync = { path = "../closure-sync" }
closure-llm = { path = "../closure-llm" }

[dev-dependencies]
tempfile = "3"
