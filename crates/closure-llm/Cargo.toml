[package]
name = "closure-llm"
description = "LLM adapter (BYOK, local, OpenAI-compatible, Claude) via the command registry only (I8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
closure-core = { path = "../closure-core" }
thiserror.workspace = true

[dev-dependencies]
closure-store = { path = "../closure-store" }
# D4 end-to-end view loop: the agent reads the ViewTree (shell-core) and
# mutates the vault through registry commands. dev-only — no cycle, as
# shell-core does not depend on closure-llm.
closure-shell-core = { path = "../closure-shell-core" }
closure-config = { path = "../closure-config" }
tempfile = "3"
