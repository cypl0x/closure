[package]
name = "closure-shell-core"
description = "Shell-agnostic launcher state core (browse/filter/detail/palette/edit/modes) shared by the gpui, egui, and future GUI shells. Dep-free of any UI toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
closure-core = { path = "../closure-core" }
closure-org = { path = "../closure-org" }
closure-store = { path = "../closure-store" }
closure-query = { path = "../closure-query" }
closure-config = { path = "../closure-config" }
closure-eval = { path = "../closure-eval" }
closure-input = { path = "../closure-input" }
closure-tree-sitter = { path = "../closure-tree-sitter" }
closure-sniffer = { path = "../closure-sniffer" }
closure-crdt = { path = "../closure-crdt" }
closure-sync = { path = "../closure-sync" }
closure-record = { path = "../closure-record" }
closure-cron = { path = "../closure-cron" }
closure-llm = { path = "../closure-llm" }

[dev-dependencies]
tempfile = "3"

[features]
# Forwarded so `highlight_spans` can pick a real grammar and
# `highlighter_name` can say which one answered. Without this the flag
# stopped at the shell crate: the grammars were compiled and the kernel
# still highlighted by keyword.
tree-sitter = ["closure-tree-sitter/tree-sitter"]
