[package]
name = "closure-cli"
description = "`closure` command-line entrypoint — subcommands for TUI, check, fmt, parse, query."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "closure"
path = "src/main.rs"

[lints]
workspace = true

[features]
# `closure gpui` is a real GPU window only when built with this feature
# (pulls Zed's stack + system libs). Default builds stay hermetic (I10);
# the subcommand then returns an instructive error.
default = []
gpui = ["closure-shell-gpui/gpui"]
egui = ["closure-shell-egui/egui"]

[dependencies]
closure-core = { path = "../closure-core" }
closure-org = { path = "../closure-org" }
closure-plugin-host = { path = "../closure-plugin-host" }
closure-query = { path = "../closure-query" }
closure-store = { path = "../closure-store" }
closure-tui = { path = "../closure-tui" }
closure-undo = { path = "../closure-undo" }
closure-config = { path = "../closure-config" }
closure-markdown = { path = "../closure-markdown" }
closure-record = { path = "../closure-record" }
closure-input = { path = "../closure-input" }
closure-whichkey = { path = "../closure-whichkey" }
closure-eval = { path = "../closure-eval" }
closure-shell-web = { path = "../closure-shell-web" }
closure-shell-gpui = { path = "../closure-shell-gpui" }
closure-shell-egui = { path = "../closure-shell-egui" }
closure-sync = { path = "../closure-sync" }
closure-llm = { path = "../closure-llm" }
closure-mcp = { path = "../closure-mcp" }
closure-acp = { path = "../closure-acp" }
closure-a2a = { path = "../closure-a2a" }
closure-cron = { path = "../closure-cron" }
closure-sniffer = { path = "../closure-sniffer" }
clap.workspace = true
thiserror.workspace = true
