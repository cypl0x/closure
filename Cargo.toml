[workspace]
resolver = "2"
members = [
  "crates/closure-org",
  "crates/closure-markdown",
  "crates/closure-tree-sitter",
  "crates/closure-core",
  "crates/closure-store",
  "crates/closure-query",
  "crates/closure-undo",
  "crates/closure-tui",
  "crates/closure-cli",
  "crates/closure-config",
  "crates/closure-input",
  "crates/closure-whichkey",
  "crates/closure-eval",
  "crates/closure-crdt",
  "crates/closure-sync",
  "crates/closure-llm",
  "crates/closure-mcp",
  "crates/closure-lsp",
  "crates/closure-acp",
  "crates/closure-a2a",
  "crates/closure-cron",
  "crates/closure-record",
  "crates/closure-plugin-host",
  "crates/closure-sniffer",
  "crates/closure-shell-egui",
  "crates/closure-shell-web",
  "crates/closure-shell-core",
  "crates/closure-shell-gpui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/cypl0x/closure"
authors = ["Wolfhard Prell <mail@wolfhard.net>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Tuned down noise:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
# `readme`, `keywords`, `categories` are publish-only metadata. They will be
# filled before crates.io release; until then, scaffold stays noise-free.
cargo_common_metadata = "allow"
# I5: no panics. Library code must propagate errors, not panic on them.
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# Core (used by multiple crates) — versions confirmed April 2026.
ulid = "1.2"

# Parser / data (closure-org)
# Parser backend: hand-written recursive descent with span preservation
# (resolved M1). No external parser crate — orgize normalises whitespace
# (breaks I1), tree-sitter-org drags a C dep and has incomplete grammar
# (breaks I5), combinator crates add a dep whose only used feature (spans)
# we get for free from the hand-written line cursor.

# TUI stack
ratatui = "0.30"
crossterm = "0.29"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Store
notify = "8.2"

# Testing
insta = { version = "1.47", features = ["yaml"] }
proptest = "1.11"

# Error ergonomics
thiserror = "2"
